name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: PsychEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: inputs.name == 'Android'
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install libVLC
        if: contains(inputs.name, 'Linux')
        run: sudo apt install libvlc-dev libvlccore-dev

      - name: Install Libraries
        run: ${{ inputs.setupCommand }}

      - name: Configure Android
        if: inputs.name == 'Android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;33.0.2" "platforms;android-33" || true

      - name: Compile
        run: |
          echo "=== 1er build Haxe (crea export) ==="
          haxelib run lime build ${{ inputs.buildArgs }} || true
          
          echo "=== Parchando 5 librerias a SDK 33 (Mac compatible) ==="
          # Baja core y core-ktx de 1.15.0 a 1.10.1 (pide 35 -> 33)
          find export -type f -name "*.gradle" -exec sed -i.bak "s/androidx.core:core:1.15.0/androidx.core:core:1.10.1/g; s/androidx.core:core-ktx:1.15.0/androidx.core:core-ktx:1.10.1/g; s/androidx.core:core:[0-9.]*'/androidx.core:core:1.10.1'/g" {} \; || true
          # Baja activity de 1.8.0 a 1.7.2 (pide 34 -> 33)
          find export -type f -name "*.gradle" -exec sed -i.bak "s/androidx.activity:activity:1.8.0/androidx.activity:activity:1.7.2/g" {} \; || true
          # Baja transition de 1.5.0 a 1.4.1 (pide 34 -> 33)
          find export -type f -name "*.gradle" -exec sed -i.bak "s/androidx.transition:transition:1.5.0/androidx.transition:transition:1.4.1/g" {} \; || true
          # Baja annotation-experimental de 1.4.1 a 1.3.1 (pide 34 -> 33)
          find export -type f -name "*.gradle" -exec sed -i.bak "s/androidx.annotation:annotation-experimental:1.4.1/androidx.annotation:annotation-experimental:1.3.1/g" {} \; || true
          # Limpia .bak de Mac
          find export -type f -name "*.bak" -delete || true
          
          echo "=== 2do build solo Gradle (sin regenerar Haxe) ==="
          GRADLEW=$(find export -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW" ]; then
            echo "Encontrado gradlew en: $GRADLEW"
            chmod +x "$GRADLEW" || true
            DIR=$(dirname "$GRADLEW")
            cd "$DIR"
            ./gradlew :app:assembleRelease || ./gradlew assembleRelease
          else
            echo "No se encontro gradlew, reintentando lime build parcheado"
            haxelib run lime build ${{ inputs.buildArgs }}
          fi

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
          
