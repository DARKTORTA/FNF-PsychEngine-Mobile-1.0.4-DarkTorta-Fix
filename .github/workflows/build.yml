name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: PsychEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Java 17 (FIX major version 65)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          architecture: arm64

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: inputs.name == 'Android'
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install libVLC
        if: contains(inputs.name, 'Linux')
        run: sudo apt install libvlc-dev libvlccore-dev

      - name: Install Libraries
        run: ${{ inputs.setupCommand }}

      - name: Configure Android
        if: inputs.name == 'Android'
        run: |
          export JAVA_HOME=$JAVA_HOME_17_arm64 || export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          java -version
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;33.0.2" "platforms;android-33" || true

      - name: Compile
        run: |
          export JAVA_HOME=$JAVA_HOME_17_arm64 || export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          java -version
          echo "=== 1er build Haxe (crea export) ==="
          haxelib run lime build ${{ inputs.buildArgs }} || true

          echo "=== Parchando con resolutionStrategy (metodo que usa Plus Engine / P-Slice) ==="
          python3 << 'PY'
          import os, pathlib, re
          # Busca todos los build.gradle de app
          for root in pathlib.Path("export").rglob("build.gradle"):
              if "app" in str(root):
                  text = root.read_text(encoding="utf-8", errors="ignore")
                  if "androidx.core:core" in text and "resolutionStrategy" in text:
                      continue
                  patch = """
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.10.1'
        force 'androidx.core:core-ktx:1.10.1'
        force 'androidx.activity:activity:1.7.2'
        force 'androidx.transition:transition:1.4.1'
        force 'androidx.annotation:annotation-experimental:1.3.1'
        force 'androidx.appcompat:appcompat:1.6.1'
        force 'androidx.appcompat:appcompat-resources:1.6.1'
    }
}
"""
                  # Inserta despues de "android {"
                  if "android {" in text:
                      text = text.replace("android {", patch + "\nandroid {", 1)
                  else:
                      text = patch + "\n" + text
                  root.write_text(text, encoding="utf-8")
                  print(f"Parcheado: {root}")
                  # Tambien baja versiones sueltas por si acaso
                  text2 = root.read_text()
                  text2 = re.sub(r"androidx\.core:core:[0-9.]+", "androidx.core:core:1.10.1", text2)
                  text2 = re.sub(r"androidx\.core:core-ktx:[0-9.]+", "androidx.core:core-ktx:1.10.1", text2)
                  text2 = re.sub(r"androidx\.activity:activity:[0-9.]+", "androidx.activity:activity:1.7.2", text2)
                  text2 = re.sub(r"androidx\.transition:transition:[0-9.]+", "androidx.transition:transition:1.4.1", text2)
                  text2 = re.sub(r"androidx\.annotation:annotation-experimental:[0-9.]+", "androidx.annotation:annotation-experimental:1.3.1", text2)
                  text2 = re.sub(r"androidx\.appcompat:appcompat:[0-9.]+", "androidx.appcompat:appcompat:1.6.1", text2)
                  text2 = re.sub(r"androidx\.appcompat:appcompat-resources:[0-9.]+", "androidx.appcompat:appcompat-resources:1.6.1", text2)
                  root.write_text(text2, encoding="utf-8")
          PY

          echo "=== 2do build solo Gradle (sin regenerar Haxe) ==="
          GRADLEW=$(find export -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW" ]; then
            echo "Gradlew en: $GRADLEW"
            chmod +x "$GRADLEW"
            DIR=$(dirname "$GRADLEW")
            cd "$DIR"
            ./gradlew :app:assembleRelease --no-daemon || ./gradlew assembleRelease --no-daemon
          else
            echo "No gradlew, reintento lime"
            haxelib run lime build ${{ inputs.buildArgs }}
          fi

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
          
