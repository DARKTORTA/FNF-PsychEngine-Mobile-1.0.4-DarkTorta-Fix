name: Mobile Release

on:
  workflow_dispatch:

jobs:
  Android:
    uses: ./.github/workflows/build.yml
    with:
      name: Android
      os: ubuntu-latest
      setupCommand: |
        haxelib install lime 8.2.1 --quiet
        haxelib install openfl 9.4.1 --quiet
        haxelib install flixel 5.6.1 --quiet
        haxelib install flixel-addons 3.3.2 --quiet
        haxelib install flixel-ui 2.6.1 --quiet
        haxelib install hscript 2.5.0 --quiet
        haxelib install hscript-iris 1.1.3 --quiet
        haxelib install hxCodec 2.5.1 --quiet
        haxelib install linc_luajit --quiet
        haxelib install hxvlc --quiet
        haxelib install flxanimate --quiet
        haxelib install tjson --quiet
        haxelib install hxcpp 4.3.2 --quiet
        haxelib list
      buildArgs: android -final
      artifactName: PsychEngine-Android
      artifactPath: export/release/android/bin/app/build/outputs/apk/release/*.apk
      
